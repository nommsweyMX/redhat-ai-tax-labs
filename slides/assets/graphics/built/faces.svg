<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="One git repository renders six faces: the interactive deck, eight labs, the presenter console, the docs book, reveal.js and PowerPoint cuts, and the adventure catalogue; GitHub Actions tests the labs and publishes to Pages."><style>:root{--ground:#FBF9F8;--surface:#FFFFFF;--surface-2:#F4EFED;--border:#E6DDDA;--border-strong:#CFC2BE;--ink:#1B1211;--ink-2:#54423E;--ink-3:#7E6A64;--accent:#CC0000;--accent-ink:#A30000;--accent-wash:#FBEAE8;--steel:#286C88;--steel-wash:#E7F1F5;--amber:#96620A;--amber-wash:#F8EFDC;--good:#1E7A55;--good-wash:#E4F3EC;--violet:#5B2E91;--violet-wash:#EFE6F7;--term-bg:#120D0C;--term-bg-2:#1C1513;--term-border:#3A2B27;--term-ink:#E8DFDC;--term-dim:#93807B;--term-green:#4FC1A0;--term-blue:#77B9E0;--shadow:0 1px 2px rgba(27,18,17,.06),0 8px 28px -14px rgba(27,18,17,.28)}text{font-family:"Red Hat Text",system-ui,sans-serif}</style><rect width="640" height="400" fill="var(--surface)"/>
<rect x="14" y="14" width="296" height="70" rx="10" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.3"/>
<text x="30" y="43" font-size="14" font-weight="800" fill="var(--ink)">Interactive deck</text>
<text x="30" y="65" font-size="10.5" fill="var(--ink-2)">18 slides · EN/ES · Show/Tell · one 731 KB file</text>
<rect x="330" y="14" width="296" height="70" rx="10" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.3"/>
<text x="346" y="43" font-size="14" font-weight="800" fill="var(--ink)">Eight labs</text>
<text x="346" y="65" font-size="10.5" fill="var(--ink-2)">43 real commands with expected output · simulate or live</text>
<rect x="14" y="98" width="296" height="70" rx="10" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.3"/>
<text x="30" y="127" font-size="14" font-weight="800" fill="var(--ink)">Presenter console</text>
<text x="30" y="149" font-size="10.5" fill="var(--ink-2)">26 sections that follow the deck window to window</text>
<rect x="330" y="98" width="296" height="70" rx="10" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.3"/>
<text x="346" y="127" font-size="14" font-weight="800" fill="var(--ink)">Docs book</text>
<text x="346" y="149" font-size="10.5" fill="var(--ink-2)">11 AsciiDoc modules · HTML and PDF</text>
<rect x="14" y="182" width="296" height="70" rx="10" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.3"/>
<text x="30" y="211" font-size="14" font-weight="800" fill="var(--ink)">reveal.js + PowerPoint</text>
<text x="30" y="233" font-size="10.5" fill="var(--ink-2)">18 slides with notes · 11 native pptx slides</text>
<rect x="330" y="182" width="296" height="70" rx="10" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.3"/>
<text x="346" y="211" font-size="14" font-weight="800" fill="var(--ink)">Adventure catalogue</text>
<text x="346" y="233" font-size="10.5" fill="var(--ink-2)">57 items · 6 reading paths by job</text>
<rect x="14" y="268" width="612" height="52" rx="10" fill="var(--accent-wash)" stroke="var(--accent)" stroke-width="1.4"/>
<text x="320" y="291" text-anchor="middle" font-size="14" font-weight="900" fill="var(--ink)">one git repository · MIT · no framework, no build step for the deck</text>
<text x="320" y="309" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">sources of truth: deck.html · labs/*/run.sh · ladder-map.json · adventure-inventory.json · docs/*.adoc</text>
<rect x="14" y="334" width="612" height="52" rx="10" fill="var(--good-wash)" stroke="var(--good)" stroke-width="1.4"/>
<text x="320" y="357" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">GitHub Actions: lint → run all eight labs → build → publish to GitHub Pages</text>
<text x="320" y="375" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">nommsweymx.github.io/redhat-ai-tax-labs · a hosted artifact for review after every round</text>
</svg>

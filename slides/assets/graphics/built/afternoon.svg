<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="The lab brief: ten fields filled in the room (problem owner, trigger, data location, rung, product, success output, who signs, nearest lab, live inputs, sample data), eight time boxes from the conversation at 0:00 to review and commit at 3:15, and the gates that run before anyone sees a slide."><style>:root{--ground:#FBF9F8;--surface:#FFFFFF;--surface-2:#F4EFED;--border:#E6DDDA;--border-strong:#CFC2BE;--ink:#1B1211;--ink-2:#54423E;--ink-3:#7E6A64;--accent:#CC0000;--accent-ink:#A30000;--accent-wash:#FBEAE8;--steel:#286C88;--steel-wash:#E7F1F5;--amber:#96620A;--amber-wash:#F8EFDC;--good:#1E7A55;--good-wash:#E4F3EC;--violet:#5B2E91;--violet-wash:#EFE6F7;--term-bg:#120D0C;--term-bg-2:#1C1513;--term-border:#3A2B27;--term-ink:#E8DFDC;--term-dim:#93807B;--term-green:#4FC1A0;--term-blue:#77B9E0;--shadow:0 1px 2px rgba(27,18,17,.06),0 8px 28px -14px rgba(27,18,17,.28)}text{font-family:"Red Hat Text",system-ui,sans-serif}</style><rect width="640" height="400" fill="var(--surface)"/>
<rect x="14" y="14" width="400" height="348" rx="10" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.3"/>
<text x="30" y="38" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="var(--accent-ink)">LAB BRIEF · ONE PAGE, FILLED IN THE ROOM</text>
<rect x="30" y="54" width="20" height="20" rx="5" fill="var(--surface-2)" stroke="var(--border-strong)"/>
<text x="40" y="68" text-anchor="middle" font-size="10" font-weight="800" fill="var(--ink-2)">a</text>
<text x="58" y="68" font-size="10.5" font-weight="500" fill="var(--ink)">Problem owner: role and team, never a name</text>
<line x1="58" y1="78" x2="398" y2="78" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 3"/>
<rect x="30" y="84" width="20" height="20" rx="5" fill="var(--surface-2)" stroke="var(--border-strong)"/>
<text x="40" y="98" text-anchor="middle" font-size="10" font-weight="800" fill="var(--ink-2)">b</text>
<text x="58" y="98" font-size="10.5" font-weight="500" fill="var(--ink)">Trigger: queue, pager or accreditation question</text>
<line x1="58" y1="108" x2="398" y2="108" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 3"/>
<rect x="30" y="114" width="20" height="20" rx="5" fill="var(--surface-2)" stroke="var(--border-strong)"/>
<text x="40" y="128" text-anchor="middle" font-size="10" font-weight="800" fill="var(--ink-2)">c</text>
<text x="58" y="128" font-size="10.5" font-weight="500" fill="var(--ink)">Data: system, boundary it must not leave, who may read it</text>
<line x1="58" y1="138" x2="398" y2="138" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 3"/>
<rect x="30" y="144" width="20" height="20" rx="5" fill="var(--surface-2)" stroke="var(--border-strong)"/>
<text x="40" y="158" text-anchor="middle" font-size="10" font-weight="800" fill="var(--ink-2)">d</text>
<text x="58" y="158" font-size="10.5" font-weight="500" fill="var(--ink)">Rung this lab proves; who climbs the next one</text>
<line x1="58" y1="168" x2="398" y2="168" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 3"/>
<rect x="30" y="174" width="20" height="20" rx="5" fill="var(--surface-2)" stroke="var(--border-strong)"/>
<text x="40" y="188" text-anchor="middle" font-size="10" font-weight="800" fill="var(--ink-2)">e</text>
<text x="58" y="188" font-size="10.5" font-weight="500" fill="var(--ink)">Product that serves the rung; the chip string</text>
<line x1="58" y1="198" x2="398" y2="198" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 3"/>
<rect x="30" y="204" width="20" height="20" rx="5" fill="var(--accent)" stroke="var(--accent)"/>
<text x="40" y="218" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">f</text>
<text x="58" y="218" font-size="10.5" font-weight="700" fill="var(--ink)">Success output: the exact lines the last command prints</text>
<line x1="58" y1="228" x2="398" y2="228" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 3"/>
<rect x="30" y="234" width="20" height="20" rx="5" fill="var(--accent)" stroke="var(--accent)"/>
<text x="40" y="248" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">g</text>
<text x="58" y="248" font-size="10.5" font-weight="700" fill="var(--ink)">Who signs: the lab ends on their screen</text>
<line x1="58" y1="258" x2="398" y2="258" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 3"/>
<rect x="30" y="264" width="20" height="20" rx="5" fill="var(--surface-2)" stroke="var(--border-strong)"/>
<text x="40" y="278" text-anchor="middle" font-size="10" font-weight="800" fill="var(--ink-2)">h</text>
<text x="58" y="278" font-size="10.5" font-weight="500" fill="var(--ink)">Nearest existing lab to copy from</text>
<line x1="58" y1="288" x2="398" y2="288" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 3"/>
<rect x="30" y="294" width="20" height="20" rx="5" fill="var(--surface-2)" stroke="var(--border-strong)"/>
<text x="40" y="308" text-anchor="middle" font-size="10" font-weight="800" fill="var(--ink-2)">i</text>
<text x="58" y="308" font-size="10.5" font-weight="500" fill="var(--ink)">Live inputs: ${VAR:-default} knobs, CLI tools</text>
<line x1="58" y1="318" x2="398" y2="318" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 3"/>
<rect x="30" y="324" width="20" height="20" rx="5" fill="var(--surface-2)" stroke="var(--border-strong)"/>
<text x="40" y="338" text-anchor="middle" font-size="10" font-weight="800" fill="var(--ink-2)">j</text>
<text x="58" y="338" font-size="10.5" font-weight="500" fill="var(--ink)">Sample data allowed in the repo; what stays out</text>
<line x1="58" y1="348" x2="398" y2="348" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 3"/>
<rect x="430" y="14" width="196" height="214" rx="10" fill="var(--steel-wash)" stroke="var(--steel)" stroke-width="1.3"/>
<text x="446" y="38" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="var(--steel)">TIME BOXES · FOUR HOURS</text>
<text x="446" y="60" font-size="10.5" font-weight="800" font-family="Red Hat Mono, monospace" fill="var(--ink)">0:00</text>
<text x="486" y="60" font-size="10.5" fill="var(--ink-2)">conversation</text>
<text x="446" y="81" font-size="10.5" font-weight="800" font-family="Red Hat Mono, monospace" fill="var(--ink)">0:30</text>
<text x="486" y="81" font-size="10.5" fill="var(--ink-2)">ladder and product</text>
<text x="446" y="102" font-size="10.5" font-weight="800" font-family="Red Hat Mono, monospace" fill="var(--ink)">0:45</text>
<text x="486" y="102" font-size="10.5" fill="var(--ink-2)">expected output</text>
<text x="446" y="123" font-size="10.5" font-weight="800" font-family="Red Hat Mono, monospace" fill="var(--ink)">1:30</text>
<text x="486" y="123" font-size="10.5" fill="var(--ink-2)">run.sh</text>
<text x="446" y="144" font-size="10.5" font-weight="800" font-family="Red Hat Mono, monospace" fill="var(--ink)">2:15</text>
<text x="486" y="144" font-size="10.5" fill="var(--ink-2)">gates</text>
<text x="446" y="165" font-size="10.5" font-weight="800" font-family="Red Hat Mono, monospace" fill="var(--ink)">2:20</text>
<text x="486" y="165" font-size="10.5" fill="var(--ink-2)">docs chapter</text>
<text x="446" y="186" font-size="10.5" font-weight="800" font-family="Red Hat Mono, monospace" fill="var(--ink)">2:50</text>
<text x="486" y="186" font-size="10.5" fill="var(--ink-2)">register, make adventure</text>
<text x="446" y="207" font-size="10.5" font-weight="800" font-family="Red Hat Mono, monospace" fill="var(--ink)">3:15</text>
<text x="486" y="207" font-size="10.5" fill="var(--ink-2)">review and commit</text>
<rect x="430" y="242" width="196" height="120" rx="10" fill="var(--good-wash)" stroke="var(--good)" stroke-width="1.3"/>
<text x="446" y="266" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="var(--good)">GATES BEFORE ANY SLIDE</text>
<text x="446" y="284.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">bash -n · step count matches</text><text x="446" y="297.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">make lint · run-all-labs · make test</text><text x="446" y="310.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">model-name grep · asset presence</text><text x="446" y="323.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">inventory fields · ladder-map chip</text><text x="446" y="336.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">equals the docs Rung row</text><text x="446" y="349.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">make adventure comes back clean</text>
<text x="320" y="388" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)">Stop the conversation only when (f) and (g) are written down. Nothing reaches a slide until a lab prints it.</text>
</svg>

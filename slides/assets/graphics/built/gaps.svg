<rect x="324" y="118" width="6" height="56" rx="3" fill="var(--accent)"/>
<text x="344" y="137" font-size="13.5" font-weight="800" fill="var(--ink)">Supply chain</text>
<text x="344" y="160" font-size="10" fill="var(--ink-2)">→ plugins, skills, MCP servers: pin, mirror, sign</text>

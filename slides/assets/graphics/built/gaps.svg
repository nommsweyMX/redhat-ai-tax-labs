<text x="34" y="68" font-size="10" fill="var(--ink-2)">→ no on-prem or weights offer; AWS classified regions only</text>
<rect x="324" y="14" width="298" height="80" rx="10" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.3"/>

<text x="344" y="45" font-size="13.5" font-weight="800" fill="var(--ink)">The DoD designation</text>
<text x="344" y="68" font-size="10" fill="var(--ink-2)">→ blocks DoW contract work regardless of technology</text>
<rect x="14" y="106" width="298" height="80" rx="10" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.3"/>
<rect x="14" y="118" width="6" height="56" rx="3" fill="var(--accent)"/>

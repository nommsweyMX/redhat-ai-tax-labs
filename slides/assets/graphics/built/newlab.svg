<circle cx="157" cy="210" r="11" fill="var(--violet)"/>
<text x="157" y="214" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">9</text>
<text x="149" y="238.0" text-anchor="start" font-size="9.8" font-weight="600" fill="var(--ink)">Deck LABS and</text><text x="149" y="251.5" text-anchor="start" font-size="9.8" font-weight="600" fill="var(--ink)">cards, preview</text><text x="149" y="265.0" text-anchor="start" font-size="9.8" font-weight="600" fill="var(--ink)">card, #lab regex</text>
<line x1="139" y1="248.0" x2="128" y2="248.0" stroke="var(--ink-3)" stroke-width="1.6" marker-end="url(#nl)"/>

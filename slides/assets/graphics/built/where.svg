<path d="M300 240 V258" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M116 240 V258" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M568 240 V250 H320 V258" fill="none" stroke="var(--ink-3)" stroke-width="1.5" marker-end="url(#wl)"/>
<text x="320" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">The agent never ran on a laptop and never inside an agency. Public content only, which is why this shape was acceptable.</text>
<text x="320" y="392" text-anchor="middle" font-size="9.5" fill="var(--ink-3)">two months later the container was new and the scratch directory was empty; only what was committed survived</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Where it ran. A person on a laptop and a phone used Claude Code on the web. Each session ran in an Anthropic-managed ephemeral container with a fresh clone, a shell, Python, node, Playwright with Chromium and LibreOffice, behind an allow-listed egress proxy, talking to the model at the API endpoint. The container pushed to GitHub, whose Actions runners ran the labs, built the docs and published to Pages; the audience loaded the deck from Pages. A hosted artifact copy lived on claude.ai. The labs ran on attendee laptops in simulate mode or on OpenShift AI, RHEL AI, Ansible Automation Platform and pgvector in live mode."><style>:root{--ground:#FBF9F8;--surface:#FFFFFF;--surface-2:#F4EFED;--border:#E6DDDA;--border-strong:#CFC2BE;--ink:#1B1211;--ink-2:#54423E;--ink-3:#7E6A64;--accent:#CC0000;--accent-ink:#A30000;--accent-wash:#FBEAE8;--steel:#286C88;--steel-wash:#E7F1F5;--amber:#96620A;--amber-wash:#F8EFDC;--good:#1E7A55;--good-wash:#E4F3EC;--violet:#5B2E91;--violet-wash:#EFE6F7;--term-bg:#120D0C;--term-bg-2:#1C1513;--term-border:#3A2B27;--term-ink:#E8DFDC;--term-dim:#93807B;--term-green:#4FC1A0;--term-blue:#77B9E0;--shadow:0 1px 2px rgba(27,18,17,.06),0 8px 28px -14px rgba(27,18,17,.28)}text{font-family:"Red Hat Text",system-ui,sans-serif}</style><rect width="640" height="400" fill="var(--surface)"/>
<defs><marker id="wl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<rect x="14" y="14" width="164" height="226" rx="10" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.3"/>
<text x="28" y="36" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="var(--ink-3)">THE PERSON</text>
<rect x="28" y="48" width="64" height="40" rx="4" fill="var(--surface-2)" stroke="var(--border-strong)"/><rect x="22" y="88" width="76" height="5" rx="2" fill="var(--border-strong)"/>
<rect x="108" y="46" width="26" height="46" rx="5" fill="var(--surface-2)" stroke="var(--border-strong)"/><circle cx="121" cy="86" r="2" fill="var(--border-strong)"/>
<text x="28" y="116.0" text-anchor="start" font-size="11" font-weight="800" fill="var(--ink)">Claude Code on the web</text><text x="28" y="130.0" text-anchor="start" font-size="11" font-weight="800" fill="var(--ink)">laptop and phone</text>
<text x="28" y="150.0" text-anchor="start" font-size="10" font-weight="400" fill="var(--ink-2)">requests in plain language</text><text x="28" y="164.0" text-anchor="start" font-size="10" font-weight="400" fill="var(--ink-2)">meeting notes, a transcript,</text><text x="28" y="178.0" text-anchor="start" font-size="10" font-weight="400" fill="var(--ink-2)">a script, five graphics</text><text x="28" y="192.0" text-anchor="start" font-size="10" font-weight="400" fill="var(--ink-2)">every diff read by a person</text><text x="28" y="206.0" text-anchor="start" font-size="10" font-weight="400" fill="var(--ink-2)">before it merged</text>
<rect x="194" y="14" width="300" height="226" rx="12" fill="none" stroke="var(--amber)" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="208" y="34" font-size="10" font-weight="700" letter-spacing="1.2" fill="var(--amber)">ANTHROPIC-MANAGED · EPHEMERAL</text>
<rect x="206" y="44" width="172" height="148" rx="8" fill="var(--amber-wash)" stroke="var(--amber)"/>
<text x="216" y="62" font-size="11.5" font-weight="800" fill="var(--ink)">Session container</text>
<text x="216" y="80.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">fresh clone of the repo</text><text x="216" y="93.5" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">bash · git · Python · node</text><text x="216" y="107.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">Playwright + Chromium</text><text x="216" y="120.5" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">LibreOffice · pdftoppm</text><text x="216" y="134.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">scratch dir, not kept</text><text x="216" y="147.5" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">MCP: GitHub, session tools</text>
<rect x="390" y="44" width="92" height="148" rx="8" fill="var(--accent-wash)" stroke="var(--accent)" stroke-width="1.4"/>
<text x="436" y="64" text-anchor="middle" font-size="12" font-weight="900" fill="var(--ink)">Model</text>
<text x="436" y="84.0" text-anchor="middle" font-size="9.5" font-weight="400" fill="var(--ink-2)">API endpoint</text><text x="436" y="97.0" text-anchor="middle" font-size="9.5" font-weight="400" fill="var(--ink-2)">context in,</text><text x="436" y="110.0" text-anchor="middle" font-size="9.5" font-weight="400" fill="var(--ink-2)">tokens out</text><text x="436" y="123.0" text-anchor="middle" font-size="9.5" font-weight="400" fill="var(--ink-2)"></text><text x="436" y="136.0" text-anchor="middle" font-size="9.5" font-weight="400" fill="var(--ink-2)">every excerpt,</text><text x="436" y="149.0" text-anchor="middle" font-size="9.5" font-weight="400" fill="var(--ink-2)">output and</text><text x="436" y="162.0" text-anchor="middle" font-size="9.5" font-weight="400" fill="var(--ink-2)">screenshot</text><text x="436" y="175.0" text-anchor="middle" font-size="9.5" font-weight="400" fill="var(--ink-2)">goes here</text>
<line x1="378" y1="100" x2="386" y2="100" stroke="var(--ink-3)" stroke-width="2" marker-end="url(#wl)"/><line x1="390" y1="130" x2="382" y2="130" stroke="var(--ink-3)" stroke-width="2" marker-end="url(#wl)"/>
<rect x="206" y="202" width="276" height="30" rx="6" fill="var(--surface)" stroke="var(--border-strong)"/>
<text x="344" y="215" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--ink)">egress proxy, allow-list</text>
<text x="344" y="227" text-anchor="middle" font-size="9" fill="var(--ink-2)">GitHub and fonts: yes · the published site, google.com: no</text>
<rect x="510" y="14" width="116" height="226" rx="10" fill="var(--good-wash)" stroke="var(--good)" stroke-width="1.3"/>
<text x="524" y="36" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="var(--good)">GITHUB</text>
<text x="524" y="58.0" text-anchor="start" font-size="10" font-weight="700" fill="var(--ink)">repository</text><text x="524" y="71.0" text-anchor="start" font-size="10" font-weight="700" fill="var(--ink)">two PRs, 44 merges</text>
<text x="524" y="96.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">Actions runners</text><text x="524" y="109.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">ubuntu-latest and the</text><text x="524" y="122.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">asciidoctor container:</text><text x="524" y="135.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">lint · 8 labs simulate</text><text x="524" y="148.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">· docs · slides · PDF</text>
<text x="524" y="176.0" text-anchor="start" font-size="10" font-weight="700" fill="var(--ink)">GitHub Pages</text><text x="524" y="189.0" text-anchor="start" font-size="10" font-weight="700" fill="var(--ink)">one public URL</text><text x="524" y="202.0" text-anchor="start" font-size="10" font-weight="700" fill="var(--ink)">for everything</text>
<line x1="178" y1="120" x2="190" y2="120" stroke="var(--ink-3)" stroke-width="2" marker-end="url(#wl)"/>
<line x1="494" y1="120" x2="506" y2="120" stroke="var(--ink-3)" stroke-width="2" marker-end="url(#wl)"/>
<text x="500" y="112" text-anchor="middle" font-size="8" fill="var(--ink-3)">push</text>
<rect x="14" y="262" width="204" height="98" rx="10" fill="var(--surface)" stroke="var(--amber)" stroke-width="1.3"/>
<text x="28" y="284" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="var(--amber)">HOSTED COPY</text>
<text x="28" y="304.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">a claude.ai artifact republished</text><text x="28" y="318.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">after every round, so the presenter</text><text x="28" y="332.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">could review on any device</text>
<rect x="218" y="262" width="204" height="98" rx="10" fill="var(--surface)" stroke="var(--good)" stroke-width="1.3"/>
<text x="232" y="284" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="var(--good)">THE AUDIENCE</text>
<text x="232" y="304.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">browsers load the deck from Pages;</text><text x="232" y="318.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">the presenter opens a second window,</text><text x="232" y="332.0" text-anchor="start" font-size="9.8" font-weight="400" fill="var(--ink-2)">the console, from the same site</text>

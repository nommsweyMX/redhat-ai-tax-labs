<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 480" role="img" aria-label="The ladder as a layered pyramid: 01 Data, what happened; 02 Information, what it means for this case; 03 Knowledge, what we know that bears on it; 04 Judgement, what we will do and who signs. Data informs every layer; the end state is knowing enough to decide; solve a problem someone has."><text x="12" y="24" font-family="Red Hat Mono, ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing=".08em" fill="#5B2E91">THE END STATE: KNOWING ENOUGH TO DECIDE</text><polygon points="159.3,41.6 160.7,41.6 196.8,129.4 123.2,129.4" fill="#5B2E91"></polygon><text x="160" y="90" text-anchor="middle" font-family="Red Hat Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#fff">04</text><line x1="184.8" y1="85.5" x2="330" y2="85.5" stroke="#CFC2BE" stroke-width="1" stroke-dasharray="2 3"></line><text x="362" y="60.5" font-family="Red Hat Mono, ui-monospace, monospace" font-size="10.5" font-weight="700" letter-spacing=".12em" fill="#5B2E91">JUDGEMENT</text><text x="362" y="77.5" font-family="Red Hat Display, Red Hat Text, system-ui, sans-serif" font-size="14" font-weight="800" fill="#1B1211">What will we do, and who signs?</text><text x="362" y="93.5" font-family="Red Hat Text, system-ui, sans-serif" font-size="11.5" fill="#54423E">A determination a named person signs. Deliberately human:</text><text x="362" y="107.5" font-family="Red Hat Text, system-ui, sans-serif" font-size="11.5" fill="#54423E">automation executes it and never decides.</text><text x="362" y="122.5" font-family="Red Hat Mono, ui-monospace, monospace" font-size="9.5" font-weight="600" letter-spacing=".04em" fill="#7E6A64">PEOPLE DECIDE · ANSIBLE EXECUTES · SIGSTORE RECORDS</text><polygon points="122,132.2 198,132.2 203.7,146 116.3,146" fill="#1D4ED8"></polygon><polygon points="115.2,148.8 204.8,148.8 240.6,235.6 79.4,235.6" fill="#1E7A55"></polygon><text x="160" y="196.7" text-anchor="middle" font-family="Red Hat Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#fff">03</text><line x1="228.7" y1="192.2" x2="330" y2="192.2" stroke="#CFC2BE" stroke-width="1" stroke-dasharray="2 3"></line><text x="362" y="167.2" font-family="Red Hat Mono, ui-monospace, monospace" font-size="10.5" font-weight="700" letter-spacing=".12em" fill="#1E7A55">KNOWLEDGE</text><text x="362" y="184.2" font-family="Red Hat Display, Red Hat Text, system-ui, sans-serif" font-size="14" font-weight="800" fill="#1B1211">What do we know that bears on this?</text><text x="362" y="200.2" font-family="Red Hat Text, system-ui, sans-serif" font-size="11.5" fill="#54423E">Information that informs an outcome: guidance, precedent,</text><text x="362" y="214.2" font-family="Red Hat Text, system-ui, sans-serif" font-size="11.5" fill="#54423E">runbooks. The institution’s memory, retrievable and cited.</text><text x="362" y="229.2" font-family="Red Hat Mono, ui-monospace, monospace" font-size="9.5" font-weight="600" letter-spacing=".04em" fill="#7E6A64">GENERATIVE AI · GROUNDED IN APPROVED SOURCES · CITED</text><polygon points="78.3,238.4 241.7,238.4 247,251.1 73,251.1" fill="#D99A00"></polygon><polygon points="71.8,253.9 248.2,253.9 280.2,331.6 39.8,331.6" fill="#C2410C"></polygon><text x="160" y="297.3" text-anchor="middle" font-family="Red Hat Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#fff">02</text><line x1="270.2" y1="292.8" x2="330" y2="292.8" stroke="#CFC2BE" stroke-width="1" stroke-dasharray="2 3"></line><text x="362" y="264.8" font-family="Red Hat Mono, ui-monospace, monospace" font-size="10.5" font-weight="700" letter-spacing=".12em" fill="#C2410C">INFORMATION</text><text x="362" y="281.8" font-family="Red Hat Display, Red Hat Text, system-ui, sans-serif" font-size="14" font-weight="800" fill="#1B1211">What does it mean for this case?</text><text x="362" y="297.8" font-family="Red Hat Text, system-ui, sans-serif" font-size="11.5" fill="#54423E">Data in context: a score, a classification, a diagnosis,</text><text x="362" y="311.8" font-family="Red Hat Text, system-ui, sans-serif" font-size="11.5" fill="#54423E">a metric. A model estimates it; a person checks it.</text><text x="362" y="326.8" font-family="Red Hat Mono, ui-monospace, monospace" font-size="9.5" font-weight="600" letter-spacing=".04em" fill="#7E6A64">PREDICTIVE AI · INFERENCE</text><polygon points="38.5,334.8 281.5,334.8 309.3,402.4 10.7,402.4" fill="#CC0000"></polygon><text x="160" y="373.1" text-anchor="middle" font-family="Red Hat Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#fff">01</text><line x1="301.4" y1="368.6" x2="330" y2="368.6" stroke="#CFC2BE" stroke-width="1" stroke-dasharray="2 3"></line><text x="362" y="348.6" font-family="Red Hat Mono, ui-monospace, monospace" font-size="10.5" font-weight="700" letter-spacing=".12em" fill="#CC0000">DATA</text><text x="362" y="365.6" font-family="Red Hat Display, Red Hat Text, system-ui, sans-serif" font-size="14" font-weight="800" fill="#1B1211">What happened?</text><text x="362" y="381.6" font-family="Red Hat Text, system-ui, sans-serif" font-size="11.5" fill="#54423E">Uninterpreted: returns, transcripts, calls, logs, telemetry.</text><text x="362" y="395.6" font-family="Red Hat Text, system-ui, sans-serif" font-size="11.5" fill="#54423E">Where it lives decides the architecture.</text><text x="362" y="410.6" font-family="Red Hat Mono, ui-monospace, monospace" font-size="9.5" font-weight="600" letter-spacing=".04em" fill="#7E6A64">THE PLATFORM · INGEST · STORE · GOVERN</text><polygon points="160,40 310,404 10,404" fill="none" stroke="#CFC2BE" stroke-width=".8"></polygon><line x1="338" y1="404" x2="338" y2="54" stroke="#7E6A64" stroke-width="1.4"></line><polygon points="338,42 333,54 343,54" fill="#7E6A64"></polygon><text transform="translate(348 222) rotate(-90)" text-anchor="middle" font-family="Red Hat Mono, ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing=".14em" fill="#7E6A64">DATA INFORMS EVERY LAYER</text><rect x="10" y="424" width="720" height="40" rx="8" fill="#F4EFED" stroke="#E6DDDA"></rect><rect x="10" y="424" width="5" height="40" rx="2.5" fill="#CC0000"></rect><text x="370" y="449" text-anchor="middle" font-family="Red Hat Display, Red Hat Text, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#1B1211">Solve a problem someone has. Don’t invent a solution to one no one has.</text></svg>

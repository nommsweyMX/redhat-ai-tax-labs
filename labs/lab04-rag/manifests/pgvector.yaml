apiVersion: v1
kind: Service
metadata:
  name: pgvector
  namespace: tax-inference
  labels: { app: pgvector }
spec:
  clusterIP: None
  selector: { app: pgvector }
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgvector
  namespace: tax-inference
  labels: { app: pgvector }
spec:
  serviceName: pgvector
  replicas: 1
  selector:
    matchLabels: { app: pgvector }
  template:
    metadata:
      labels: { app: pgvector }
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              value: tax_guidance
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef: { name: pgvector-auth, key: username }
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: pgvector-auth, key: password }
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          resources:
            requests: { cpu: "500m", memory: 2Gi }
            limits:   { cpu: "2",    memory: 8Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ ReadWriteOnce ]
        resources:
          requests:
            storage: 50Gi
